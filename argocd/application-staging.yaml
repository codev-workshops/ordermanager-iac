apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ordermanager-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: ordermanager
    app.kubernetes.io/part-of: ordermanager
    environment: staging
  finalizers:
    # Deleting the Application deletes its resources (Namespace is kept).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/codev-workshops/ordermanager-iac.git
    targetRevision: main
    path: helm/ordermanager
    helm:
      releaseName: ordermanager-staging
      valueFiles:
        - values.yaml
        - values-staging.yaml
      valuesObject:
        namespace:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: decomposition-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
