replicaCount: 1

image:
  repository: 599083837640.dkr.ecr.us-east-1.amazonaws.com/workshop/ordermanager
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: ordermanager.workshop.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Keeps at least minAvailable pods up during voluntary disruptions (node drains,
# cluster upgrades). AlwaysAllow lets pods that aren't Ready be evicted anyway,
# so a crash-looping pod can't block a drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

# Spread replicas across nodes (hard) and zones (soft). The chart adds the
# selector labels as labelSelector plus matchLabelKeys: [pod-template-hash],
# so only pods of the same rollout are counted and rolling updates aren't
# blocked. nodeTaintsPolicy: Honor skips nodes the pod can't tolerate.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# Rendered into the ConfigMap (sync wave 1) and loaded with envFrom.
config:
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__DefaultConnection: "Data Source=/data/ordermanager.db"

# Extra container env entries (e.g. secretKeyRef); takes precedence over config.
env: []

# Render the release Namespace as sync wave 0. Enabled by the Argo CD
# Applications; leave off for `helm install --create-namespace`.
namespace:
  create: false
  labels: {}

deployment:
  # Argo CD marks the Deployment Degraded once a rollout exceeds this.
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5

# Readiness gates the Deployment's Argo CD health; /api/products reads the
# database, /health only proves Kestrel is serving (SPA fallback).
probes:
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/products
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# PostSync hook: curls the Service after every sync; a failure fails the sync.
smokeTest:
  enabled: true
  image: curlimages/curl:8.10.1
  paths:
    - /health
    - /api/products
  backoffLimit: 2
  activeDeadlineSeconds: 180
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: gp2

monitoring:
  enabled: true
  path: /metrics
  port: 8080
