replicaCount: 1

image:
  tag: dev-latest

ingress:
  hosts:
    - host: ordermanager-dev.workshop.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: "Data Source=ordermanager.db"

persistence:
  enabled: false
